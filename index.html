<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>SANA POS</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#172334;background:#fff;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:default}#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}.top{flex:none}.camera{position:relative;width:100%;height:min(32dvh,265px);min-height:170px;background:#111c28;overflow:hidden}.camera video{width:100%;height:100%;object-fit:cover}.camera #reader{width:100%;height:100%}.camera #reader video{width:100%!important;height:100%!important;object-fit:cover!important}.camera #reader img{display:none!important}.camera:after{content:"";pointer-events:none;position:absolute;inset:20% 11%;border:2px solid #70b0ff;border-radius:4px}.camera-status{position:absolute;left:10px;bottom:10px;right:10px;text-align:center;color:white;background:#142334c9;padding:7px;font-size:13px;border-radius:4px;pointer-events:none}.camera-start{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);background:#1766d9;color:white;border:0;padding:13px 18px;border-radius:4px;white-space:nowrap}.camera-tools{position:absolute;right:8px;top:8px;z-index:3;display:flex;gap:7px}.camera-tools button{background:#142334cc;border:1px solid #ffffff66;color:#fff;border-radius:4px;padding:8px 10px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:8px;background:white}.tabs button{min-height:46px;border:1px solid #d5dce7;background:#f5f7fa;color:#2c3c50;border-radius:4px;font-weight:600}.tabs button.active{background:#1766d9;color:white;border-color:#1766d9}.search-view{height:min(32dvh,265px);min-height:170px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:9px}.search-view input{width:100%;height:48px;border:1px solid #aebccc;border-radius:4px;padding:0 12px;font-size:16px;outline-color:#1766d9}.results{overflow:auto;flex:1}.result{width:100%;padding:11px 3px;text-align:left;background:#fff;border:0;border-bottom:1px solid #edf0f4;display:flex;justify-content:space-between;align-items:center;gap:8px}.result small{display:block;color:#69788c;margin-top:3px}.result b{color:#1766d9;white-space:nowrap}.basket{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}.basket-head{display:flex;justify-content:space-between;align-items:center;padding:11px 12px 5px}.basket-head strong{font-size:18px}.basket-head small{color:#66788c;font-size:13px}.link{background:none;border:0;color:#1766d9;padding:8px;font-size:14px}.line{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;border-bottom:1px solid #e9edf3}.line-info{flex:1;min-width:0}.line-name{font-size:15px;font-weight:600;overflow-wrap:anywhere}.line-price{color:#6b7789;margin-top:5px;font-size:14px}.qty{display:flex;align-items:center;gap:8px;flex:none}.qty button{height:46px;width:46px;border:1px solid #cbd8eb;background:#f0f5fc;color:#1766d9;border-radius:4px;font-size:26px;font-weight:500}.qty button.plus{background:#1766d9;color:white;border-color:#1766d9}.qty span{min-width:24px;text-align:center;font-weight:700}.empty{padding:30px 16px;text-align:center;color:#7b8797;font-size:15px}.bottom{flex:none;padding:12px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #e6eaf0;background:white}.total{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.total strong{font-size:23px}.primary{width:100%;height:52px;background:#1766d9;border:0;color:white;font-weight:700;border-radius:4px}.overlay{position:fixed;z-index:20;inset:0;background:#07152580;display:flex;align-items:flex-end;justify-content:center}.sheet{background:white;width:100%;max-width:560px;border-radius:10px 10px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:94dvh;overflow:auto}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.sheet-head h2{font-size:20px;margin:0}.close{background:none;border:0;font-size:26px;color:#64748b;padding:2px 8px}.methods{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.methods button{height:54px;border:1px solid #cbd5e1;border-radius:4px;background:white;font-weight:600}.methods button.active{border:2px solid #1766d9;background:#edf4ff;color:#1766d9}.field-title{font-weight:600;font-size:14px;margin:12px 0 7px}.discount-row{display:flex;gap:8px}.discount-row input{flex:1;min-width:0}.discount-row select{width:85px}.field{height:50px;padding:0 12px;border:1px solid #bdc9d8;border-radius:4px;font-size:16px;background:#fff;color:#172334}.summary-row{display:flex;justify-content:space-between;gap:10px;margin:13px 0;font-size:15px}.summary-row.big{font-weight:700;font-size:21px;padding-top:12px;border-top:1px solid #e5eaf0}.summary-row.muted{color:#68788c}.note{font-size:13px;color:#68788c;margin-top:10px}.danger{background:#cf3443}.modal-center{align-items:center;padding:16px}.confirm{border-radius:8px;padding:20px;max-width:400px}.confirm h2{margin:0 0 10px;font-size:19px}.confirm p{color:#5d6c7f}.confirm-actions{display:flex;gap:8px}.confirm-actions button{flex:1;height:48px;border-radius:4px;border:1px solid #cbd5e1;background:white}.confirm-actions .danger{color:white;border:0;background:#cf3443}.toast{position:fixed;z-index:40;bottom:100px;left:50%;transform:translateX(-50%);background:#203146;color:white;padding:10px 14px;border-radius:5px;font-size:14px;max-width:90%;text-align:center}.hidden{display:none!important}@media(max-height:650px){.camera,.search-view{height:25dvh;min-height:125px}.line{padding:8px 12px}}
</style>
</head>
<body>
<div id="app">
 <div class="top">
  <div id="camera" class="camera">
   <div id="reader"></div>
   <div class="camera-tools"><button id="torch" class="hidden" type="button">Фонарик</button></div>
   <button id="start" class="camera-start" type="button">Включить камеру</button>
   <div id="cameraStatus" class="camera-status hidden"></div>
  </div>
  <div id="searchView" class="search-view hidden"><input id="search" type="search" placeholder="Название, артикул или штрихкод" autocomplete="off"><div id="results" class="results"></div></div>
  <div class="tabs"><button type="button" id="scanTab" class="active">▥ Сканер</button><button type="button" id="searchTab">⌕ Поиск</button></div>
 </div>
 <main class="basket"><div class="basket-head"><div><strong>Корзина</strong> <small id="count">0 шт.</small></div><button class="link" id="clear">Очистить</button></div><div id="lines"></div></main>
 <footer class="bottom"><div class="total"><span>Итого</span><strong id="total">0 сом</strong></div><button class="primary" id="pay" disabled>К оплате</button></footer>
</div>
<div id="paymentOverlay" class="overlay hidden"><div class="sheet" role="dialog" aria-modal="true" aria-label="Оплата"><div class="sheet-head"><h2>Оплата</h2><button class="close" id="closePayment" aria-label="Закрыть">×</button></div><div class="summary-row muted"><span>Сумма товаров</span><span id="subtotal">0 сом</span></div><div class="methods"><button id="cash" class="active">Наличные</button><button id="card">Карта</button></div><div class="field-title">Скидка</div><div class="discount-row"><input id="discount" class="field" type="number" min="0" step="any" inputmode="decimal" placeholder="0" value="0"><select id="discountMode" class="field" aria-label="Тип скидки"><option value="som">сом</option><option value="pct">%</option></select></div><div class="summary-row muted" id="discountSummary"><span>Скидка</span><span id="discountSom">0 сом</span></div><div class="summary-row big"><span>К оплате</span><span id="due">0 сом</span></div><div id="cashFields"><div class="field-title">Получено наличными</div><input id="received" class="field" style="width:100%" type="number" min="0" step="any" inputmode="decimal" placeholder="Введите сумму"><div class="summary-row"><span>Сдача</span><strong id="change">0 сом</strong></div></div><div id="cardFields" class="summary-row hidden"><span>Получено по карте</span><strong id="cardReceived">0 сом</strong></div><button id="confirmPayment" class="primary" disabled>Подтвердить оплату</button></div></div>
<div id="clearOverlay" class="overlay modal-center hidden"><div class="sheet confirm" role="alertdialog" aria-modal="true"><h2>Очистить корзину?</h2><p>Все добавленные товары будут удалены.</p><div class="confirm-actions"><button id="cancelClear">Отмена</button><button id="confirmClear" class="danger">Очистить</button></div></div></div>
<div id="toast" class="toast hidden" role="status"></div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
'use strict';
// DEMO ONLY. Never put Google Sheets API keys, tokens, or private customer data in this file.
const products=[{id:'p1',name:'Футболка мужская',sku:'ART-1024',barcode:'5901234123457',price:1200},{id:'p2',name:'Носки хлопковые',sku:'ART-3051',barcode:'4601234567893',price:250},{id:'p3',name:'Шарф белый',sku:'ART-2040',barcode:'2000000000015',price:1000}];
const cart=new Map();let scanner=null,scanning=false,cameraStarting=false,cameraStopping=false,cameraDenied=false,mode='scan',paymentMethod='cash',lastCode='',lastScan=0,toastTimer;
const $=id=>document.getElementById(id),money=n=>Number(n).toLocaleString('ru-RU',{maximumFractionDigits:2})+' сом',round=n=>Math.round((n+Number.EPSILON)*100)/100;
const amount=()=>round([...cart.values()].reduce((s,x)=>s+x.product.price*x.qty,0));
function showToast(message){$('toast').textContent=message;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2300)}
function add(product){const existing=cart.get(product.id);cart.set(product.id,{product,qty:(existing?.qty||0)+1});renderCart();}
function changeQty(id,delta){const x=cart.get(id);if(!x)return;const q=x.qty+delta;if(q<=0)cart.delete(id);else x.qty=q;renderCart()}
function renderCart(){const lines=$('lines');lines.replaceChildren();let count=0;for(const [id,x] of cart){count+=x.qty;const row=document.createElement('div');row.className='line';const info=document.createElement('div');info.className='line-info';const name=document.createElement('div');name.className='line-name';name.textContent=x.product.name;const price=document.createElement('div');price.className='line-price';price.textContent=money(x.product.price)+' / шт.';info.append(name,price);const qty=document.createElement('div');qty.className='qty';const minus=document.createElement('button');minus.type='button';minus.textContent='−';minus.setAttribute('aria-label','Уменьшить количество '+x.product.name);minus.onclick=()=>changeQty(id,-1);const n=document.createElement('span');n.textContent=x.qty;const plus=document.createElement('button');plus.type='button';plus.className='plus';plus.textContent='+';plus.setAttribute('aria-label','Увеличить количество '+x.product.name);plus.onclick=()=>changeQty(id,1);qty.append(minus,n,plus);row.append(info,qty);lines.append(row)}$('count').textContent=count+' шт.';$('total').textContent=money(amount());$('pay').disabled=!cart.size;$('clear').disabled=!cart.size}
function searchProducts(){const q=$('search').value.trim().toLowerCase();const results=$('results');results.replaceChildren();if(!q)returnconst found=products.filter(p=>[p.name,p.sku,p.barcode].some(v=>v.toLowerCase().includes(q))).slice(0,30);if(!found.length){const el=document.createElement('div');el.className='empty';el.textContent='Товар не найден';results.append(el)}for(const p of found){const row=document.createElement('button');row.className='result';const info=document.createElement('div');info.textContent=p.name;const sub=document.createElement('small');sub.textContent=p.sku+' · '+p.barcode;info.append(sub);const price=document.createElement('b');price.textContent=money(p.price);row.append(info,price);row.onclick=()=>{add(p);$('search').value='';searchProducts();$('search').focus()};results.append(row)}}
function onScan(code){const now=Date.now();if(code===lastCode&&now-lastScan<1300)return;lastCode=code;lastScan=now;const product=products.find(p=>p.barcode===code);if(product)add(product);else showToast('Нет товара: '+code)}
// Safari remembers site permissions when the user chooses Allow. Camera auto-start is
// attempted on every visit; if iOS requires a gesture, the fallback button appears.
async function startCamera(){
 if(scanning||cameraStarting||cameraStopping||mode!=='scan'||document.hidden)return;
 if(!window.Html5Qrcode){$('cameraStatus').textContent='Ошибка камеры';$('cameraStatus').classList.remove('hidden');$('start').classList.remove('hidden');return}
 cameraStarting=true;
 $('start').classList.add('hidden');$('cameraStatus').classList.add('hidden');
 try{
  if(!scanner)scanner=new Html5Qrcode('reader',{verbose:false});
  await scanner.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>({width:Math.min(280,Math.floor(w*.85)),height:Math.min(130,Math.floor(h*.7))})},onScan,()=>{});
  scanning=true;cameraDenied=false;
  const caps=scanner.getRunningTrackCapabilities?.();
  $('torch').classList.toggle('hidden',!caps?.torch);
  if(mode!=='scan'||document.hidden)await stopCamera();
 }catch(err){
  console.warn('Camera start:',err);
  cameraDenied=true;
  $('start').classList.remove('hidden');
  $('cameraStatus').textContent='Нет доступа к камере';
  $('cameraStatus').classList.remove('hidden');
 }finally{cameraStarting=false}
}
async function stopCamera(){
 if(cameraStopping)return;
 if(cameraStarting){ // Wait for the pending start without racing the camera library.
  for(let i=0;i<30&&cameraStarting;i++)await new Promise(r=>setTimeout(r,100));
 }
 if(!scanning)return;
 cameraStopping=true;
 try{await scanner.stop()}catch(e){console.warn(e)}
 finally{scanning=false;cameraStopping=false;$('torch').classList.add('hidden');$('start').classList.add('hidden');$('cameraStatus').classList.add('hidden')}
}
async function setMode(next){
 if(mode===next)return;
 mode=next;
 const isScan=next==='scan';
 $('scanTab').classList.toggle('active',isScan);$('searchTab').classList.toggle('active',!isScan);
 $('camera').classList.toggle('hidden',!isScan);$('searchView').classList.toggle('hidden',isScan);
 if(!isScan){await stopCamera();$('search').focus()}
 else{$('search').blur();await startCamera()}
}
let torchOn=false;async function toggleTorch(){try{torchOn=!torchOn;await scanner.applyVideoConstraints({advanced:[{torch:torchOn}]});$('torch').textContent=torchOn?'Выключить свет':'Фонарик'}catch(e){torchOn=false;showToast('Фонарик недоступен')}}
function discountValue(){const v=Math.max(0,Number($('discount').value)||0);const subtotal=amount();return round(Math.min(subtotal,$('discountMode').value==='pct'?subtotal*Math.min(v,100)/100:v))}
function dueAmount(){return round(Math.max(0,amount()-discountValue()))}
function renderPayment(){const subtotal=amount(),discount=discountValue(),due=dueAmount();$('subtotal').textContent=money(subtotal);$('discountSom').textContent='−'+money(discount);$('discountSummary').classList.toggle('hidden',discount===0);$('due').textContent=money(due);$('cardReceived').textContent=money(due);$('cash').classList.toggle('active',paymentMethod==='cash');$('card').classList.toggle('active',paymentMethod==='card');$('cashFields').classList.toggle('hidden',paymentMethod!=='cash');$('cardFields').classList.toggle('hidden',paymentMethod!=='card');const received=Number($('received').value);$('change').textContent=money(Math.max(0,round(received-due)));$('confirmPayment').disabled=paymentMethod==='cash'&&($('received').value===''||!Number.isFinite(received)||received<due);$('confirmPayment').textContent='Подтвердить · '+money(due)}
function openPayment(){if(!cart.size)return;paymentMethod='cash';$('discount').value='0';$('discountMode').value='som';$('received').value='';$('paymentOverlay').classList.remove('hidden');renderPayment()}
function closePayment(){$('paymentOverlay').classList.add('hidden');document.activeElement?.blur?.()}
function setPaymentMethod(method){paymentMethod=method;renderPayment();if(method==='cash'){// iOS may require the focus to occur directly in this user gesture.
$('received').focus()}}
$('start').onclick=()=>{cameraDenied=false;startCamera()};$('torch').onclick=toggleTorch;$('scanTab').onclick=()=>setMode('scan');$('searchTab').onclick=()=>setMode('search');$('search').addEventListener('input',searchProducts);$('clear').onclick=()=>{if(cart.size)$('clearOverlay').classList.remove('hidden')};$('cancelClear').onclick=()=>$('clearOverlay').classList.add('hidden');$('confirmClear').onclick=()=>{cart.clear();renderCart();$('clearOverlay').classList.add('hidden')};$('pay').onclick=openPayment;$('closePayment').onclick=closePayment;$('cash').onclick=()=>setPaymentMethod('cash');$('card').onclick=()=>setPaymentMethod('card');$('discount').addEventListener('input',renderPayment);$('discountMode').addEventListener('change',renderPayment);$('received').addEventListener('input',renderPayment);
$('confirmPayment').onclick=()=>{if($('confirmPayment').disabled)return;const receipt={items:[...cart.values()].map(x=>({name:x.product.name,price:x.product.price,qty:x.qty})),subtotal:amount(),discountSom:discountValue(),due:dueAmount(),method:paymentMethod,received:paymentMethod==='card'?dueAmount():Number($('received').value),change:paymentMethod==='card'?0:round(Number($('received').value)-dueAmount())};console.info('DEMO receipt, not persisted:',receipt);closePayment();cart.clear();renderCart();showToast('Тест: продажа не сохранена');if(mode==='search')setMode('scan')};
renderCart();searchProducts();
// Start without an extra tap when Safari permits it. Do not retry permission errors in a loop.
window.addEventListener('load',()=>startCamera(),{once:true});
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){stopCamera()}
 else if(mode==='scan'&&!cameraDenied){setTimeout(()=>startCamera(),200)}
});
window.addEventListener('pageshow',e=>{if(e.persisted&&mode==='scan'&&!cameraDenied)startCamera()});
</script>
</body></html>
