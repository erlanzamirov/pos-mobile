<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SANA POS • Тест</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{margin:0;font:16px -apple-system,BlinkMacSystemFont,Arial;background:#f4f7fb;color:#142033}main{max-width:550px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center}h2{margin:0}small{color:#64748b}.panel{background:white;padding:16px;border-radius:16px;margin:14px 0;box-shadow:0 3px 16px #1e293b0a}button{border:0;border-radius:10px;padding:12px 16px;background:#1763e9;color:white;font-weight:650;font-size:15px}button.alt{background:#e8efff;color:#1452bc}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #d5deeb;border-radius:10px;font-size:16px;margin:10px 0}#reader{width:100%;overflow:hidden;border-radius:12px}#reader video{width:100%!important}.line{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #edf0f5}.line:last-child{border:0}.qty{display:flex;align-items:center;gap:12px}.qty button{padding:7px 12px}.muted{color:#64748b;font-size:13px}#status{overflow-wrap:anywhere}#results button{margin:5px 0;width:100%;text-align:left}#flash{display:none}</style></head><body><main><header><h2>SANA POS</h2><small>Тест • без продаж</small></header><section class="panel"><b>Сканер штрихкодов</b><p class="muted">Камера остаётся включённой после сканирования.</p><button id="start">Включить камеру</button> <button id="stop" class="alt">Выключить</button> <button id="flash" class="alt">Фонарик</button><div id="reader"></div><p id="status" class="muted">Ожидание запуска</p></section><section class="panel"><b>Поиск / ввод штрихкода</b><input id="search" placeholder="Название или штрихкод"><div id="results"></div></section><section class="panel"><b>Корзина</b><div id="basket" class="muted">Корзина пуста</div><div class="line"><strong>Итого</strong><strong id="total">0 сом</strong></div><p class="muted">Демонстрационные товары. Никакие данные в Google Sheets не записываются.</p></section></main><script>const goods=[{code:'5901234123457',name:'Тестовый товар',price:150},{code:'4601234567893',name:'Тестовый шарф',price:800},{code:'12345678',name:'Тестовые перчатки',price:400}];const basket=new Map();let scanner=null,last='',lastTime=0,torch=false;const el=id=>document.getElementById(id);function add(g){const old=basket.get(g.code)||{...g,qty:0};old.qty++;basket.set(g.code,old);render()}function render(){el('basket').innerHTML='';let total=0;if(!basket.size)el('basket').textContent='Корзина пуста';for(const g of basket.values()){total+=g.price*g.qty;const line=document.createElement('div');line.className='line';const label=document.createElement('span');label.textContent=g.name+' · '+g.price+' сом';const q=document.createElement('div');q.className='qty';const minus=document.createElement('button');minus.textContent='−';minus.onclick=()=>{g.qty--;if(g.qty<=0)basket.delete(g.code);render()};const count=document.createElement('b');count.textContent=g.qty;const plus=document.createElement('button');plus.textContent='+';plus.onclick=()=>add(g);q.append(minus,count,plus);line.append(label,q);el('basket').append(line)}el('total').textContent=total+' сом'}function results(){const s=el('search').value.toLowerCase().trim();el('results').innerHTML='';if(!s)return;const matched=goods.filter(g=>g.name.toLowerCase().includes(s)||g.code.includes(s));if(!matched.length){el('results').textContent='Товар не найден (тестовый каталог)';return}for(const g of matched){const b=document.createElement('button');b.className='alt';b.textContent=g.name+' · '+g.price+' сом';b.onclick=()=>{add(g);el('search').value='';results()};el('results').append(b)}}el('search').addEventListener('input',results);el('start').onclick=async()=>{try{if(!window.Html5Qrcode)throw Error('Библиотека не загрузилась');if(scanner){await scanner.stop();await scanner.clear()}scanner=new Html5Qrcode('reader');el('status').textContent='Запрашиваем камеру…';await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:150}},code=>{const now=Date.now();if(code===last&&now-lastTime<1500)return;last=code;lastTime=now;const g=goods.find(x=>x.code===code);if(g){add(g);el('status').textContent='Добавлен: '+g.name}else el('status').textContent='Считан код '+code+' — товара нет в тестовом каталоге'},()=>{});el('status').textContent='Камера работает. Наведите на штрихкод';el('flash').style.display='inline-block'}catch(e){el('status').textContent='Ошибка: '+String(e)}};el('stop').onclick=async()=>{if(scanner&&scanner.isScanning){await scanner.stop();await scanner.clear();scanner=null}el('flash').style.display='none';el('status').textContent='Камера выключена'};el('flash').onclick=async()=>{try{torch=!torch;await scanner.applyVideoConstraints({advanced:[{torch}]});el('flash').textContent=torch?'Выключить фонарик':'Фонарик'}catch(e){el('status').textContent='Фонарик недоступен: '+e.message}};</script></body></html>
